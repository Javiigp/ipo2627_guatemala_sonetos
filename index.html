<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sonetos Guatemala</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/dark.css"
        id="darkTheme"
        disabled
    >

</head>


<body>


    <section class="body">

        <header class="header">

            <h1>Sonetos</h1>

            <button class="boton">
                Oscuro/Claro
            </button>

        </header>

        <aside class="aside">

            <nav
                class="CajaAside"
                id="listaSonetos">
            </nav>

        </aside>

        <main class="content">

            <h1
                class="nombreSoneto"
                id="nombreSoneto">
            </h1>

            <section class="cajaSoneto">

                <article class="texto">
                    <div>
                        <strong id="tituloSoneto"></strong>
                    </div>

                    <div>
                        <strong id="autorSoneto"> </strong>
                    </div>

                    <strong>
                        Soneto
                    </strong>

                    <div
                        class="poema"
                        id="poema">
                    </div>

                </article>


            </section>


        </main>

        <footer class="footer">
            Grupo Guatemala-IPO
        </footer>

    </section>


    <script
        type="module"
        src="/javascript/controller.js">
    </script>


</body>

</html>
